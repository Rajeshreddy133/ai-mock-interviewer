spring.application.name=ai-mock-interviewer
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_mock_interviewer}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Groq (OpenAI-compatible API)
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
groq.max-completion-tokens=${GROQ_MAX_COMPLETION_TOKENS:1200}

# JWT - set JWT_SECRET_KEY in production. Must be at least 32 characters.
jwt.secret=${JWT_SECRET_KEY:my-super-secret-key-for-ai-mock-interviewer-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Local React development
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# Resume upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
